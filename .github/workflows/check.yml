name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check README translations
        run: node scripts/check-readme-translations.mjs
      # Run the remaining checks even when an earlier one fails, so one pull request shows every result.
      # A new skill that ships only an English README fails the translation check until a maintainer adds the translations.
      - name: Check skill templates
        if: ${{ !cancelled() }}
        run: node scripts/check-templates.mjs
      - name: Run script tests
        if: ${{ !cancelled() }}
        run: node --test scripts/*.test.mjs
