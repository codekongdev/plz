<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="문서에 근거한 문제로 공부하고, 해설과 오답 복습으로 이해도를 확인하는 퀴즈입니다.">
  <link rel="icon" href="data:,">
  <title>plz 기여 가이드</title>
  <style>
    :root {
      color-scheme: light;
      --quiz-paper: #F3F5F6; --quiz-surface: #FFFFFF; --quiz-ink: #1E2429; --quiz-muted: #596169;
      --quiz-rule: #D6DBDF; --quiz-control-edge: #7A838B;
      --quiz-pen: #2546B0; --quiz-pen-strong: #1C3891; --quiz-on-pen: #FFFFFF; --quiz-pen-wash: #E8EDFB;
      --quiz-grade: #B42F28; --quiz-highlight: #FFE36A;
      --quiz-font-ui: "Pretendard Variable", "Pretendard", "SUIT Variable", "SUIT", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      --quiz-font-serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
      --quiz-font-figure: "Iowan Old Style", "Palatino Linotype", "Palatino", "Book Antiqua", Georgia, serif;
      --quiz-bar-h: 0px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --quiz-paper: #1C2125; --quiz-surface: #242A2F; --quiz-ink: #E7EAEC; --quiz-muted: #A9B1B8;
        --quiz-rule: #384047; --quiz-control-edge: #7F8992;
        --quiz-pen: #9DB4FF; --quiz-pen-strong: #BCCBFF; --quiz-on-pen: #111A33; --quiz-pen-wash: #263150;
        --quiz-grade: #FF8F82; --quiz-highlight: rgba(255, 216, 74, .3);
      }
    }
    html:lang(ja) {
      --quiz-font-ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
      --quiz-font-serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    }
    html:lang(zh) {
      --quiz-font-ui: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      --quiz-font-serif: "Songti SC", "Noto Serif SC", "SimSun", serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--quiz-paper); scroll-padding-top: calc(var(--quiz-bar-h) + 24px); }
    body { margin: 0; font-family: var(--quiz-font-ui); font-size: 17px; line-height: 1.65; font-weight: 400;
      color: var(--quiz-ink); background: var(--quiz-paper); font-synthesis: none; text-rendering: optimizeLegibility;
      overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
    html:lang(ko) body { word-break: keep-all; }
    html:lang(ja) body, html:lang(zh) body { line-break: strict; }
    h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote, figure { margin: 0; }
    ul, ol { padding: 0; }
    button, input, textarea { font: inherit; color: inherit; }
    button, label, a { -webkit-tap-highlight-color: transparent; }
    a { color: var(--quiz-pen); text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid var(--quiz-pen); outline-offset: 3px; }
    [tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
    .sr-only, .skip-link:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .skip-link:focus { position: fixed; z-index: 30; left: 16px; top: 12px; padding: 12px 20px; border-radius: 8px;
      background: var(--quiz-pen); color: var(--quiz-on-pen); font-weight: 600; }
    .quiz-serif { font-family: var(--quiz-font-serif); font-weight: 400; }
    .quiz-figure { font-family: var(--quiz-font-figure); font-weight: 400; font-variant-numeric: lining-nums tabular-nums; }

    /* Buttons */
    button { cursor: pointer; min-height: 48px; padding: 11px 22px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; font-weight: 600; line-height: 1.4; text-align: center;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
    .button-primary { background: var(--quiz-pen); color: var(--quiz-on-pen); }
    .button-primary:hover { background: var(--quiz-pen-strong); }
    .button-secondary { background: var(--quiz-surface); border-color: var(--quiz-control-edge); color: var(--quiz-ink); }
    .button-secondary:hover { border-color: var(--quiz-ink); }
    .button-quiet { min-height: 44px; min-width: 44px; padding: 10px 8px; color: var(--quiz-pen); }
    .button-quiet:hover { text-decoration: underline; text-underline-offset: 5px; }
    .quiz-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 24px; }
    .quiz-actions > .button-quiet:first-child, .quiz-missing-list li:first-child .button-quiet { margin-left: -8px; }
    .quiz-actions .is-end { margin-left: auto; }
    .quiz-actions .is-end ~ .is-end { margin-left: 0; }
    .quiz-actions-note { font-size: 14px; color: var(--quiz-muted); }

    /* Masthead and sticky bar */
    .quiz-masthead { max-width: 880px; margin: 0 auto; padding: 64px 32px 0; }
    .quiz-source-line { font-size: 14px; line-height: 1.5; color: var(--quiz-muted); }
    .quiz-title { max-width: 680px; margin-top: 16px; font-family: var(--quiz-font-serif); font-weight: 400;
      font-size: 36px; line-height: 1.4; }
    #quiz-header.is-bar { position: sticky; top: 0; z-index: 10; background: var(--quiz-paper);
      border-bottom: 1px solid var(--quiz-rule); }
    .quiz-bar { max-width: 880px; margin: 0 auto; padding: 6px 32px; min-height: 64px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; }
    .quiz-bar-title { flex: 1 1 160px; min-width: 0; font-family: var(--quiz-font-serif); font-weight: 400;
      font-size: 17px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quiz-bar-mode { display: flex; gap: 12px; font-size: 14px; color: var(--quiz-muted); white-space: nowrap; }
    .quiz-bar-mode .is-practice { color: var(--quiz-ink); font-weight: 600; }

    /* Answer sheet */
    .quiz-sheet-list { display: flex; flex-wrap: wrap; gap: 4px 8px; list-style: none; }
    .quiz-cell { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px;
      min-height: 0; padding: 0; border: 0; border-radius: 8px; color: var(--quiz-muted); font-size: 17px; line-height: 1; }
    button.quiz-cell:hover { background: var(--quiz-pen-wash); }
    .quiz-cell:focus-visible { outline-offset: -3px; }
    .quiz-cell-num { position: relative; display: grid; place-items: center; width: 26px; height: 32px; border-radius: 50%;
      font-family: var(--quiz-font-figure); font-variant-numeric: lining-nums tabular-nums;
      transition: background-color 120ms ease, color 120ms ease; }
    .quiz-cell-num::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 1px; height: 2px;
      border-radius: 1px; background: var(--quiz-rule); }
    [data-state="answered"] .quiz-cell-num, [data-state="selfPending"] .quiz-cell-num {
      background: var(--quiz-pen); color: var(--quiz-on-pen); }
    [data-state="answered"] .quiz-cell-num::after, [data-state="selfPending"] .quiz-cell-num::after,
    [data-state="correct"] .quiz-cell-num::after, [data-state="incorrect"] .quiz-cell-num::after,
    [data-state="selfUnderstood"] .quiz-cell-num::after, [data-state="selfReview"] .quiz-cell-num::after { content: none; }
    [data-state="skipped"] .quiz-cell-num::after { left: calc(50% - 5px); right: auto; bottom: 0; width: 10px; height: 3px;
      border-radius: 2px; background: var(--quiz-muted); }
    [data-state="correct"], [data-state="incorrect"], [data-state="selfUnderstood"], [data-state="selfReview"] { color: var(--quiz-ink); }
    .quiz-cell.is-assisted .quiz-cell-num::before { content: ""; position: absolute; left: 3px; right: 3px; bottom: -5px;
      border-bottom: 2px dotted var(--quiz-ink); }
    .quiz-cell[aria-current="step"] { box-shadow: inset 0 0 0 1.5px var(--quiz-ink); }
    .quiz-sheet.is-large .quiz-cell { width: 56px; height: 60px; font-size: 24px; }
    .quiz-sheet.is-large .quiz-cell-num { width: 36px; height: 44px; }

    /* Hand-drawn marks */
    .quiz-mark, .quiz-dash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none;
      stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .quiz-mark.is-grade { color: var(--quiz-grade); }
    .quiz-mark.is-pen { color: var(--quiz-pen); }
    .quiz-dash { color: var(--quiz-muted); }
    .quiz-dash.is-blank { color: var(--quiz-control-edge); stroke-width: 2; }
    .quiz-mark path { stroke-dasharray: 1 2; stroke-dashoffset: 0; }
    .quiz-mark.is-drawing path { animation: quiz-draw 360ms cubic-bezier(.3, .7, .4, 1) var(--quiz-delay, 0ms) both; }
    @keyframes quiz-draw { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }

    /* Page and start screen */
    .quiz-page { max-width: 880px; margin: 0 auto; padding: 40px 32px 96px; }
    [data-screen="start"] { padding-top: 0; }
    .quiz-lede { max-width: 680px; margin: 0 0 40px; font-size: 21px; line-height: 1.6; }
    .quiz-facts { display: grid; grid-template-columns: 88px minmax(0, 680px); gap: 16px 24px; max-width: 792px; margin-bottom: 40px;
      padding: 24px 0; border-top: 1px solid var(--quiz-rule); border-bottom: 1px solid var(--quiz-rule); }
    .quiz-facts dt { font-size: 14px; font-weight: 600; color: var(--quiz-muted); padding-top: 3px; }
    .quiz-fact-sub { display: block; color: var(--quiz-muted); }
    .quiz-practice-notice { max-width: 680px; margin: -16px 0 32px; padding-left: 16px; border-left: 3px solid var(--quiz-pen); }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    legend { padding: 0; }
    .quiz-mode-options { max-width: 792px; }
    .quiz-mode-options legend { margin-bottom: 12px; font-weight: 600; }
    .quiz-mode { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; cursor: pointer;
      border-bottom: 1px solid var(--quiz-rule); }
    .quiz-mode:first-of-type { border-top: 1px solid var(--quiz-rule); }
    .quiz-mode strong { display: block; font-weight: 600; }
    .quiz-mode-copy { color: var(--quiz-muted); }
    .quiz-radio { appearance: none; -webkit-appearance: none; flex: none; display: grid; place-items: center;
      width: 24px; height: 24px; margin: 2px 0 0; border: 1.5px solid var(--quiz-control-edge); border-radius: 50%;
      background: var(--quiz-surface); cursor: pointer; transition: border-color 120ms ease; }
    .quiz-radio::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--quiz-pen);
      transform: scale(0); transition: transform 120ms ease; }
    .quiz-radio:checked { border-color: var(--quiz-pen); }
    .quiz-radio:checked::before { transform: scale(1); }
    .quiz-start-action { margin-top: 32px; }
    .quiz-start-action .button-primary { min-width: 200px; }

    /* Questions */
    .quiz-instruction, .quiz-submit { margin-left: 112px; }
    .quiz-instruction { max-width: 680px; margin-bottom: 48px; color: var(--quiz-muted); }
    .quiz-question { display: grid; grid-template-columns: 88px minmax(0, 680px); column-gap: 24px; }
    .quiz-question + .quiz-question { margin-top: 48px; padding-top: 48px; border-top: 1px solid var(--quiz-rule); }
    .quiz-q-gutter { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .quiz-q-num { font-size: 48px; line-height: 1; color: var(--quiz-ink); }
    .quiz-q-type { font-size: 14px; line-height: 1.4; color: var(--quiz-muted); white-space: nowrap; }
    .quiz-prompt { margin-bottom: 24px; font-family: var(--quiz-font-serif); font-weight: 400; font-size: 24px; line-height: 1.7;
      scroll-margin-top: calc(var(--quiz-bar-h) + 24px); }
    .quiz-hint { margin: -8px 0 24px; padding: 2px 0 2px 16px; border-left: 3px solid var(--quiz-pen); }
    .quiz-hint-title { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; font-weight: 600; color: var(--quiz-pen); }
    .quiz-hint-title span { color: var(--quiz-muted); font-weight: 400; }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-option { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: start;
      column-gap: 16px; padding: 13px 16px; min-height: 56px; background: var(--quiz-surface);
      border: 1px solid var(--quiz-control-edge); border-radius: 10px; cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease; }
    .quiz-option > input { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; margin: 0; opacity: 0;
      appearance: none; -webkit-appearance: none; cursor: inherit; border-radius: 10px; }
    .quiz-option:hover { border-color: var(--quiz-ink); }
    .quiz-option:has(input:focus-visible) { outline: 3px solid var(--quiz-pen); outline-offset: 3px; }
    .quiz-option:has(input:checked), .quiz-option.is-picked { border-color: var(--quiz-pen); background: var(--quiz-pen-wash); }
    .quiz-option:has(input:disabled), .quiz-option.is-static { cursor: default; }
    .quiz-option.is-graded:hover { border-color: var(--quiz-control-edge); }
    .quiz-option.is-graded.is-picked:hover { border-color: var(--quiz-pen); }
    .quiz-option:has(input:disabled:not(:checked)):not(.is-graded) { color: var(--quiz-muted); }
    .quiz-option.is-graded:not(.is-key):not(.is-picked) { color: var(--quiz-muted); }
    .quiz-bubble { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid var(--quiz-control-edge); color: var(--quiz-muted); font-size: 15px; line-height: 1;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
    .quiz-option:has(input:checked) .quiz-bubble, .quiz-option.is-picked .quiz-bubble {
      background: var(--quiz-pen); border-color: var(--quiz-pen); color: var(--quiz-on-pen); }
    .quiz-bubble .quiz-mark { inset: auto; left: -9px; top: -11px; width: 46px; height: 50px; }
    .quiz-option-text { padding-top: 1px; }
    .quiz-tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding-top: 2px; }
    .quiz-tag { display: inline-block; padding: 2px 8px; border: 1.5px solid currentColor; border-radius: 4px;
      font-size: 14px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
    .quiz-tag[data-tag="picked"] { color: var(--quiz-pen); }
    .quiz-tag[data-tag="key"] { color: var(--quiz-grade); }
    .quiz-options.is-ox { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .quiz-option.is-ox { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-items: center;
      align-content: start; row-gap: 8px; padding: 16px 20px; min-height: 0; }
    .quiz-ox-glyph { position: relative; display: grid; place-items: center; width: 52px; height: 56px;
      font-family: var(--quiz-font-serif); font-size: 40px; line-height: 1; color: var(--quiz-muted); }
    .quiz-option:has(input:checked) .quiz-ox-glyph, .quiz-option.is-ox.is-picked .quiz-ox-glyph { color: var(--quiz-pen); }
    .quiz-option.is-ox .quiz-tags { grid-column: 1 / -1; justify-content: flex-start; }
    .quiz-graded-options .quiz-option.is-ox { grid-template-columns: 28px minmax(0, 1fr) auto; row-gap: 0; padding: 13px 16px; }
    .quiz-graded-options .quiz-ox-glyph { width: 28px; height: 28px; font-size: 26px; }
    .quiz-graded-options .quiz-ox-glyph .quiz-mark { inset: auto; left: -9px; top: -11px; width: 46px; height: 50px; }
    .quiz-graded-options .quiz-option.is-ox .quiz-tags { grid-column: auto; justify-content: flex-end; }
    .quiz-field label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 132px; padding: 14px 16px; resize: vertical;
      background: var(--quiz-surface); color: var(--quiz-ink); border: 1px solid var(--quiz-control-edge);
      border-radius: 10px; line-height: 1.65; transition: border-color 120ms ease; }
    textarea:hover:not(:disabled) { border-color: var(--quiz-ink); }
    textarea:disabled { color: var(--quiz-muted); background: transparent; }
    .quiz-help { margin-top: 8px; font-size: 14px; color: var(--quiz-muted); }
    .quiz-validation { margin-top: 12px; padding-left: 12px; border-left: 3px solid var(--quiz-pen); font-weight: 600; }

    /* Feedback */
    .quiz-feedback { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--quiz-rule); }
    .quiz-verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px;
      font-size: 21px; font-weight: 600; line-height: 1.4; scroll-margin-top: calc(var(--quiz-bar-h) + 24px); }
    .quiz-verdict-mark { position: relative; flex: none; width: 28px; height: 31px; }
    .quiz-verdict .quiz-tag { color: var(--quiz-muted); font-size: 14px; }
    .quiz-note { font-size: 14px; color: var(--quiz-muted); }
    .quiz-feedback > .quiz-note { margin: -8px 0 16px; }
    .quiz-graded-options { display: grid; gap: 8px; margin-bottom: 24px; list-style: none; }
    .quiz-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px; margin-bottom: 24px; }
    .quiz-label { margin-bottom: 4px; font-size: 14px; font-weight: 600; color: var(--quiz-muted); }
    .quiz-compare p { white-space: pre-wrap; }
    .quiz-compare .is-mine p:not(.quiz-label) { color: var(--quiz-pen); }
    .quiz-compare .is-mine p.is-empty { color: var(--quiz-muted); }
    .quiz-essential-points { margin-bottom: 24px; padding-left: 24px; }
    .quiz-self-check { margin: 0 0 24px; padding: 16px 0; border-top: 1px solid var(--quiz-rule); border-bottom: 1px solid var(--quiz-rule); }
    .quiz-self-check legend { float: left; width: 100%; margin-bottom: 4px; font-weight: 600; }
    .quiz-self-check legend + * { clear: both; }
    .quiz-self-check .quiz-note { margin-bottom: 8px; }
    .quiz-self-check label { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
    .quiz-self-check .quiz-radio { margin: 0; }
    .quiz-explanation { margin-bottom: 24px; }
    .quiz-evidence-title { font-size: 14px; font-weight: 600; color: var(--quiz-muted); }
    .quiz-source-locator { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 16px; margin-bottom: 8px;
      font-size: 14px; color: var(--quiz-muted); }
    .quiz-source-locator a { font-weight: 600; }
    .quiz-source-quote { padding-inline: 3px; white-space: break-spaces; line-height: 1.9; }
    .quiz-highlight { margin-inline: -3px; padding: 2px 3px; border-radius: 2px; background: var(--quiz-highlight); color: var(--quiz-ink);
      -webkit-box-decoration-break: clone; box-decoration-break: clone; }

    /* Check-mode submission */
    .quiz-submit { max-width: 680px; margin-top: 64px; padding-top: 32px; border-top: 1px solid var(--quiz-ink); }
    .quiz-progress-text { font-size: 17px; }
    .quiz-incomplete { margin-top: 24px; padding: 20px 0 4px 20px; border-left: 3px solid var(--quiz-pen); }
    .quiz-incomplete h2 { font-size: 21px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
    .quiz-missing-list { display: flex; flex-wrap: wrap; gap: 0 8px; margin-top: 8px; list-style: none; }
    .quiz-incomplete .quiz-actions { margin-top: 12px; }
    [data-screen="quiz"] > [data-incomplete-slot] > .quiz-incomplete { margin-left: 112px; max-width: 680px; margin-top: 48px; }

    /* Results */
    .quiz-results-title { font-family: var(--quiz-font-serif); font-weight: 400; font-size: 36px; line-height: 1.4; }
    .quiz-original-score { margin-top: 16px; padding-left: 16px; border-left: 3px solid var(--quiz-rule); }
    .quiz-original-score h3 { font-size: 14px; font-weight: 600; color: var(--quiz-muted); }
    .quiz-original-value { font-family: var(--quiz-font-figure); font-size: 21px; font-variant-numeric: lining-nums tabular-nums; }
    .quiz-scoreboard { margin-top: 24px; }
    .quiz-score { font-family: var(--quiz-font-figure); font-variant-numeric: lining-nums tabular-nums; line-height: 1.1;
      font-size: 21px; color: var(--quiz-ink); }
    .quiz-score-correct { font-size: 72px; color: var(--quiz-grade); }
    .quiz-score-total { font-size: 36px; }
    .quiz-score-text { color: var(--quiz-muted); }
    .quiz-score-caption { max-width: 680px; margin-top: 8px; color: var(--quiz-muted); }
    .quiz-score-caption + .quiz-score-caption { margin-top: 0; }
    .quiz-counts { display: grid; grid-template-columns: repeat(3, max-content); gap: 8px 48px; margin-top: 24px;
      padding: 16px 0; border-top: 1px solid var(--quiz-rule); border-bottom: 1px solid var(--quiz-rule); }
    .quiz-counts div { display: flex; align-items: baseline; gap: 12px; }
    .quiz-counts dt { font-size: 14px; color: var(--quiz-muted); }
    .quiz-counts dd { font-family: var(--quiz-font-figure); font-size: 21px; font-variant-numeric: lining-nums tabular-nums; }
    .quiz-section-title { margin-bottom: 12px; font-size: 21px; font-weight: 600; line-height: 1.4; }
    .quiz-result-sheet, .quiz-review, .quiz-result-items { margin-top: 48px; }

    append(app, data.description ? element('p', 'quiz-lede', data.description) : null,
      state.original ? element('p', 'quiz-practice-notice', text('practiceNotice')) : null, facts, modes,

  }
  function startQuiz(questions = data.questions) {

  }

  /* ---------- Answer controls ---------- */
  function optionTags(isPicked, isKey) {
    if (!isPicked && !isKey) return null;
    return append(element('span', 'quiz-tags'),
      isPicked ? element('span', 'quiz-tag', text('yourAnswer'), { 'data-tag': 'picked' }) : null,
      isKey ? element('span', 'quiz-tag', text('answerKey'), { 'data-tag': 'key' }) : null);
  }
  function optionFace(question, option, index, gradeMark) {

    if (gradeMark) face.append(gradeMark);

  }
  function optionMark(isPicked, isKey, draw) {

  }
  function optionClass(question, graded, isPicked, isKey) {
    return ['quiz-option', question.type === 'ox' ? 'is-ox' : '', graded ? 'is-graded' : '',

  }
  function choiceControls(question, response, article, revealed) {

    const draw = revealed && shouldDraw(`options:${question.id}`);
    question.options.forEach((option, index) => {
      const isPicked = response.submitted && !response.skipped && response.draft === option.id;
      const isKey = revealed && option.id === question.answer;
      const label = element('label', optionClass(question, revealed, isPicked, isKey));
      const input = element('input', '', null, { type: 'radio', name: `answer-${question.id}`, value: option.id });
      input.checked = !response.skipped && response.draft === option.id;
      input.disabled = revealed || response.skipped;
      input.addEventListener('change', () => setDraft(question, option.id, article));
      append(label, input, optionFace(question, option, index, revealed ? optionMark(isPicked, isKey, draw) : null),
        element('span', 'quiz-option-text', option.text), revealed ? optionTags(isPicked, isKey) : null);
      fieldset.append(label);

  }
  function shortControls(question, response, article) {

    return append(field, element('label', '', text('answerLabel'), { for: `answer-${question.id}` }), input,
      element('p', 'quiz-help', text('shortHelp'), { id: `help-${question.id}` }));
  }
  function setDraft(question, value, article) {
    const response = responseFor(question);

    response.skipped = false;
    clearValidation(question, article);
    updateProgress();
    refreshIncomplete();
  }
  function showValidation(question, article) {
    if (article.querySelector('[data-validation]')) return;

    const control = article.querySelector('.quiz-options, .quiz-short-answer');
    control?.setAttribute('aria-describedby', [control.getAttribute('aria-describedby'), id].filter(Boolean).join(' '));
    article.querySelector('.quiz-options, .quiz-field')?.after(message);
  }
  function clearValidation(question, article) {
    const message = article.querySelector('[data-validation]');

    const control = article.querySelector('.quiz-options, .quiz-short-answer');

  /* ---------- Question article ---------- */
  function questionHeading(question, index) {
    const heading = element('h2', 'quiz-prompt', null, { id: `question-${question.id}`, tabindex: '-1' });
    const context = joinList([text('questionNumber', { number: index + 1 }), text(question.type)]) + text('listSeparator');
    return append(heading, element('span', 'sr-only', context), document.createTextNode(question.prompt));
  }
  function hintNote(question) {
    return append(element('aside', 'quiz-hint', null, { 'aria-label': text('hintTitle') }),
      append(element('p', 'quiz-hint-title'), document.createTextNode(text('hintTitle')), element('span', '', text('assisted'))),
      element('p', '', question.hint));
  }
  function toggleSkip(question) {
    const response = responseFor(question);

    response.submitted = response.skipped;
    const article = replaceArticle(question);
    updateProgress();
    refreshIncomplete();
    if (state.mode === 'learning' && response.skipped) revealFeedback(article, question, response);

  }
  function showHint(question) {
    const response = responseFor(question);

    announce(text('hintAnnounce'));
  }
  function questionActions(question, response, index, article) {
    const actions = element('div', 'quiz-actions');

    if (question.hint && !response.hintVisible) actions.append(quietButton(text('hint'), 'hint', () => showHint(question)));
    if (response.skipped) actions.append(element('span', 'quiz-actions-note', text('skipped')));
    actions.append(quietButton(text(response.skipped ? 'undoSkip' : 'skip'), response.skipped ? 'undo-skip' : 'skip', () => toggleSkip(question)));

    const last = index === state.attempt.questions.length - 1;
    const tail = [];
    if (index > 0) tail.push(quietButton(text('previous'), 'previous', () => navigate(index - 1)));
    tail.push(last ? quietButton(text('showResults'), 'finish', () => finishAttempt()) : quietButton(text('later'), 'next', () => navigate(index + 1)));
    tail.forEach(node => node.classList.add('is-end'));
    return append(actions, tail);
  }
  function feedbackNav(index) {
    const last = index === state.attempt.questions.length - 1;
    return append(element('div', 'quiz-actions', null, last ? { 'data-submit-actions': '' } : {}),
      last ? button(text('showResults'), 'finish', () => finishAttempt(), 'primary') : button(text('next'), 'next', () => navigate(index + 1), 'primary'),
      index > 0 ? button(text('previous'), 'previous', () => navigate(index - 1)) : null);
  }
  function questionArticle(question, index) {
    const response = responseFor(question);

    const article = element('article', 'quiz-question', null, { 'data-question-id': question.id, 'aria-labelledby': `question-${question.id}` });
    const gutter = append(element('div', 'quiz-q-gutter', null, { 'aria-hidden': 'true' }),
      element('span', 'quiz-q-num quiz-figure', String(index + 1)), element('span', 'quiz-q-type', text(question.type)));
    const body = append(element('div', 'quiz-q-body'), questionHeading(question, index),
      response.hintVisible ? hintNote(question) : null);
    if (question.type !== 'short') body.append(choiceControls(question, response, article, revealed));
    else if (!revealed) body.append(shortControls(question, response, article));

  }
  function replaceArticle(question) {
    const index = state.attempt.questions.indexOf(question);

  }
  function revealFeedback(article, question, response) {

    const verdict = article.querySelector('[data-verdict]');

    announce(verdictLabel(question, response));
  }
  function commitQuestion(question, article) {
    const response = responseFor(question);

      showValidation(question, article);
      return;
    }
    response.submitted = true;
    const fresh = replaceArticle(question);
    updateProgress();
    refreshIncomplete();
    revealFeedback(fresh, question, response);
  }

  /* ---------- Feedback ---------- */
  function verdictLabel(question, response) {
    const raw = rawVerdict(question, response);
    return text(VERDICT_KEYS[raw] ?? raw);
  }
  function verdictMark(question, response, draw) {
    const raw = rawVerdict(question, response);
    const holder = element('span', 'quiz-verdict-mark', null, { 'aria-hidden': 'true' });
    if (GRADE_MARKS[raw]) holder.append(mark(GRADE_MARKS[raw][0], GRADE_MARKS[raw][1], draw));

  function fillVerdict(heading, question, response, draw) {

  function answerText(question, response) {

  }
  function gradedRows(question, response) {

    question.options.forEach((option, index) => {
      const isPicked = response.submitted && !response.skipped && response.draft === option.id;
      const isKey = option.id === question.answer;
      if (!isPicked && !isKey) return;
      const row = element('li', `${optionClass(question, true, isPicked, isKey)} is-static`);
      append(row, optionFace(question, option, index, optionMark(isPicked, isKey, false)),

  }
  function shortComparison(question, response) {

      append(element('div'), element('p', 'quiz-label', text('referenceAnswer')), element('p', '', question.referenceAnswer)));

      append(element('span'), document.createTextNode(source.document), element('span', '', ' › ', { 'aria-hidden': 'true' }),
        element('span', 'sr-only', text('listSeparator')), document.createTextNode(source.section)),
      source.url ? element('a', 'quiz-source-link', text('sourceLink'), { href: source.url, target: '_blank', rel: 'noopener noreferrer' }) : null);
    return append(element('div', 'quiz-evidence'), element('h4', 'quiz-evidence-title', text('evidence')), locator,

  }
  function feedback(question, response, { inResults = false } = {}) {
    const section = element('section', 'quiz-feedback', null, { 'data-feedback': question.id });
    const heading = element('h3', 'quiz-verdict', null, { tabindex: '-1' });
    fillVerdict(heading, question, response, !inResults && shouldDraw(`verdict:${question.id}`));
    section.append(heading);
    if (response.assisted) section.append(element('p', 'quiz-note', text(question.type === 'short' ? 'assistedShortNote' : 'assistedNote')));
    if (outcome(question, response) === 'unanswered' && response.draft.trim()) section.append(element('p', 'quiz-note', text('draftNotice')));
    if (question.type !== 'short' && inResults) section.append(gradedRows(question, response));
    if (question.type === 'short') {
      section.append(shortComparison(question, response));
      if (question.essentialPoints.length) {

          append(element('ul', 'quiz-essential-points'), question.essentialPoints.map(point => element('li', '', point))));
      }
      if (response.submitted && !response.skipped) section.append(selfCheck(question, response));

  }
  function selfCheck(question, response) {
    const fieldset = element('fieldset', 'quiz-self-check');

    for (const [value, key] of [['understood', 'understood'], ['review', 'needsReview']]) {
      const label = element('label');
      const input = element('input', 'quiz-radio', null, { type: 'radio', name: `self-${question.id}`, value, 'data-self-check': value });
      input.checked = response.selfAssessment === value;
      input.addEventListener('change', () => applySelfCheck(question, response, value, fieldset));

  }
  function applySelfCheck(question, response, value, fieldset) {

    if (state.screen === 'results') refreshResults(question);
    else refreshBarSheet();
    announce(text(value === 'understood' ? 'selfUnderstood' : 'selfReview'));
  }

  /* ---------- Quiz screen ---------- */
  function navigate(index) {
    state.attempt.index = index;
    state.confirmEarly = false;
    render();
    focusTop(app.querySelector('.quiz-prompt'));
  }
  function updateProgress() {
    const progress = document.getElementById('quiz-progress-text');
    if (progress) progress.textContent = text('progress', { answered: recordedCount(), total: state.attempt.questions.length });
    refreshBarSheet();
  }
  function jumpToMissing(question) {
    closeIncomplete();
    if (state.mode === 'learning') navigate(state.attempt.questions.indexOf(question));
    else goToQuestion(question);
  }
  function incompletePrompt() {
    const missing = missingQuestions();
    if (!missing.length) return null;
    const section = element('section', 'quiz-incomplete', null, { 'aria-labelledby': 'incomplete-heading' });
    append(section, element('h2', '', text('incompleteTitle'), { id: 'incomplete-heading', tabindex: '-1' }),
      element('p', '', text('incompleteText', { count: missing.length })));
    const list = element('ul', 'quiz-missing-list');
    for (const question of missing) {
      const index = state.attempt.questions.indexOf(question);
      list.append(append(element('li'), quietButton(text('questionNumber', { number: index + 1 }), 'go-missing', () => jumpToMissing(question))));
    }
    append(section, list, append(element('div', 'quiz-actions'),
      button(text('continueQuiz'), 'continue', () => {
        const question = missingQuestions()[0];
        if (question) { jumpToMissing(question); return; }
        closeIncomplete();
        app.querySelector('[data-action="finish"]')?.focus();
      }, 'primary'),
      button(text('earlySubmit'), 'submit-early', () => finishAttempt(true))));
    return section;
  }
  function syncSubmitActions() {
    const open = Boolean(app.querySelector('.quiz-incomplete'));
    app.querySelectorAll('[data-submit-actions]').forEach(actions => { actions.hidden = open; });
  }
  function closeIncomplete() {
    state.confirmEarly = false;
    app.querySelector('.quiz-incomplete')?.remove();
    syncSubmitActions();
  }
  function refreshIncomplete() {
    if (!state.confirmEarly) return;
    const old = app.querySelector('.quiz-incomplete');
    const missingKey = JSON.stringify(missingQuestions().map(question => question.id));
    if (old && old.dataset.missing === missingKey) return;
    const fresh = incompletePrompt();
    if (!fresh) { closeIncomplete(); return; }
    fresh.dataset.missing = missingKey;
    if (old) old.replaceWith(fresh);
    else app.querySelector('[data-incomplete-slot]')?.append(fresh);
    syncSubmitActions();
  }
  function finishAttempt(force = false) {
    const missing = missingQuestions();
    if (missing.length && !force) {
      state.confirmEarly = true;
      refreshIncomplete();
      focusInView(app.querySelector('.quiz-incomplete h2'));
      return;
    }
    if (state.mode === 'check') {
      for (const question of state.attempt.questions) {
        const response = responseFor(question);
        if (!response.skipped && response.draft.trim()) response.submitted = true;
      }
    }
    state.attempt.finished = true;
    if (!state.original) state.original = state.attempt;

    state.confirmEarly = false;

    focusTop(app.querySelector('.quiz-results-title'));
    announce(text('resultsAnnounce'));
  }
  function renderQuiz() {
    const slot = element('div', '', null, { 'data-incomplete-slot': '' });

      app.append(element('p', 'quiz-instruction', text('checkBatchHelp')));
      state.attempt.questions.forEach((question, index) => app.append(questionArticle(question, index)));
      const progress = element('p', 'quiz-progress-text', text('progress', { answered: recordedCount(), total: state.attempt.questions.length }), { id: 'quiz-progress-text' });
      app.append(append(element('div', 'quiz-submit'), progress, slot,
        append(element('div', 'quiz-actions', null, { 'data-submit-actions': '' }), button(text('finish'), 'finish', () => finishAttempt(), 'primary'))));
      app.addEventListener('focusin', trackCurrent);
    } else {
      app.append(questionArticle(state.attempt.questions[state.attempt.index], state.attempt.index), slot);
    }

  }
  function trackCurrent(event) {
    if (state.screen !== 'quiz' || state.mode !== 'check') return;
    const article = event.target.closest?.('.quiz-question');
    if (article) setCurrent(state.attempt.questions.findIndex(question => question.id === article.dataset.questionId));
  }

  /* ---------- Results ---------- */
  function retryQuestions() {
    return state.attempt.questions.filter(question => REVIEW_OUTCOMES.includes(outcome(question, responseFor(question))) && question.retry)
      .map(question => question.retry);
  }
  function resultSummary() {
    const summary = summarize(state.attempt);
    const board = element('div', 'quiz-scoreboard', null, { id: 'quiz-result-summary', 'data-summary': '' });
    const score = element('p', 'quiz-score', null, { 'data-score': '' });
    if (summary.denominator) score.append(textParts('score', { correct: summary.correct, total: summary.denominator }, 'quiz-score'));
    else score.textContent = text('noScore');
    const counts = element('dl', 'quiz-counts');
    const entries = [['correct', summary.correct], ['incorrect', summary.incorrect], ['skipped', summary.skipped],
      ['unanswered', summary.unanswered], ['assisted', summary.assisted]];
    if (summary.short) entries.push(['selfChecked', summary.checked], ['selfPending', summary.pending]);
    for (const [key, value] of entries) counts.append(append(element('div'), element('dt', '', text(key)), element('dd', '', String(value))));
    return append(board, score, element('p', 'quiz-score-caption', text('scorePolicy')),
      element('p', 'quiz-score-caption', text('coverage', { answered: summary.answered, total: summary.total })),
      summary.short ? element('p', 'quiz-score-caption', text('shortCounts', summary)) : null, counts);
  }
  function setItemOpen(item, open) {
    const toggle = item.querySelector('.quiz-item-toggle');
    toggle.setAttribute('aria-expanded', String(open));
    item.querySelector('.quiz-item-body').hidden = !open;
    state.attempt.openItems.set(item.dataset.questionId, open);
  }
  function openResultItem(question) {
    const item = app.querySelector(`.quiz-result-item[data-question-id="${CSS.escape(question.id)}"]`);
    if (!item) return;
    setItemOpen(item, true);
    focusInView(item.querySelector('.quiz-item-toggle'));
  }
  function resultSheet() {
    return append(element('section', 'quiz-result-sheet', null, { id: 'quiz-result-sheet', 'aria-labelledby': 'quiz-result-sheet-title' }),
      element('h3', 'quiz-section-title', text('answerSheet'), { id: 'quiz-result-sheet-title' }),
      answerSheet({ interactive: true, large: true, onSelect: openResultItem, drawPrefix: 'results', stagger: true }));
  }
  function conceptList() {
    const groups = new Map();
    state.attempt.questions.forEach((question, index) => {
      if (!REVIEW_OUTCOMES.includes(outcome(question, responseFor(question)))) return;
      groups.set(question.concept, [...(groups.get(question.concept) ?? []), text('questionShort', { number: index + 1 })]);
    });
    if (!groups.size) return null;
    const list = element('ul', 'quiz-concepts');
    for (const [concept, numbers] of groups) list.append(append(element('li'), document.createTextNode(concept), element('span', '', joinList(numbers))));
    return list;
  }
  function resultReview() {
    const section = element('section', 'quiz-review', null, { id: 'quiz-result-review' });
    const concepts = conceptList();
    if (concepts) append(section, element('h3', 'quiz-section-title', text('reviewConcepts')), concepts);
    const retry = retryQuestions();
    if (!retry.length && concepts) section.append(element('p', 'quiz-note', text('noRetry')));
    const actions = element('div', 'quiz-actions');
    if (retry.length) actions.append(button(text('retry'), 'retry', () => startQuiz(retry), 'primary'));
    actions.append(button(text('newPractice'), 'new-practice', () => {
      state.screen = 'start';
      state.attempt = null;
      render();
      focusTop(header.querySelector('h1'));
    }, retry.length ? 'secondary' : 'primary'));
    if (state.attempt.practice) actions.append(quietButton(text('returnInitial'), 'original-results', () => {
      state.attempt = state.original;
      state.mode = state.original.mode;
      state.screen = 'results';
      render();
      focusTop(app.querySelector('.quiz-results-title'));
    }));
    return append(section, actions);
  }
  function fillToggle(toggle, question, index) {
    const response = responseFor(question);
    const prompt = append(element('span', 'quiz-item-prompt'),
      element('span', 'sr-only', text('questionNumber', { number: index + 1 }) + text('listSeparator')), document.createTextNode(question.prompt));
    const words = [text(rawVerdict(question, response)), response.assisted ? text('assisted') : null].filter(Boolean);
    toggle.replaceChildren(sheetCell(question, index, { interactive: false, decorative: true }), prompt,
      element('span', 'quiz-item-outcome', joinList(words)));
  }
  function resultItem(question, index) {
    const response = responseFor(question);
    const item = element('article', 'quiz-result-item', null, { 'data-question-id': question.id });
    const toggle = element('button', 'quiz-item-toggle', null, { type: 'button', id: `toggle-${question.id}`, 'aria-controls': `panel-${question.id}` });
    fillToggle(toggle, question, index);
    const body = append(element('div', 'quiz-item-body', null, { id: `panel-${question.id}`, role: 'region', 'aria-labelledby': `toggle-${question.id}` }),

    append(item, append(element('h4', 'quiz-item-heading'), toggle), body);
    const remembered = state.attempt.openItems.get(question.id);
    setItemOpen(item, remembered ?? !SETTLED_OUTCOMES.includes(outcome(question, response)));
    toggle.addEventListener('click', () => setItemOpen(item, toggle.getAttribute('aria-expanded') !== 'true'));
    return item;
  }
  function refreshResults(question) {
    document.getElementById('quiz-result-summary')?.replaceWith(resultSummary());
    document.getElementById('quiz-result-sheet')?.replaceWith(resultSheet());
    document.getElementById('quiz-result-review')?.replaceWith(resultReview());
    const index = state.attempt.questions.indexOf(question);
    const toggle = document.getElementById(`toggle-${question.id}`);
    if (toggle) fillToggle(toggle, question, index);
  }
  function renderResults() {
    const section = element('section', 'quiz-results');
    section.append(element('h2', 'quiz-results-title', text(state.attempt.practice ? 'practiceResultsTitle' : 'resultsTitle'), { tabindex: '-1' }));
    if (state.attempt.practice && state.original) {
      const original = summarize(state.original);
      append(section, append(element('aside', 'quiz-original-score', null, { 'data-original-score': '' }),
        element('h3', '', text('originalScore')), element('p', 'quiz-original-value', scoreText(original)),
        element('p', 'quiz-note', text('coverage', { answered: original.answered, total: original.total }))));
    }
    const items = append(element('div', 'quiz-result-list'), state.attempt.questions.map((question, index) => resultItem(question, index)));
    append(section, resultSummary(), resultSheet(), resultReview(),
      append(element('section', 'quiz-result-items', null, { 'aria-labelledby': 'quiz-result-items-title' }),
        element('h3', 'quiz-section-title', text('resultsDetails'), { id: 'quiz-result-items-title' }), items));
    app.append(section);
  }

  /* ---------- Render loop ---------- */
  function render() {
    app.removeEventListener('focusin', trackCurrent);
    renderHeader();
    app.replaceChildren();
    app.dataset.screen = state.screen;
    app.dataset.mode = state.mode;
    if (state.screen === 'start') renderStart();
    else if (state.screen === 'quiz') renderQuiz();
    else renderResults();
  }
  function snapshot() {
    const current = state.attempt;
    return {
      screen: state.screen, mode: state.mode,
      attempt: current ? { number: current.number, practice: current.practice, finished: current.finished, summary: summarize(current),
        responses: Object.fromEntries([...current.responses].map(([id, response]) => [id, { ...response }])) } : null,
      original: state.original ? { number: state.original.number, summary: summarize(state.original) } : null,
    };
  }
  try {
    if (!header || !app) throw new Error('Missing quiz containers');
    data = validate(JSON.parse(document.getElementById('quiz-data').textContent));
    document.documentElement.lang = data.lang || 'en';
    document.title = data.title;
    const skipLink = document.querySelector('.skip-link');
    if (skipLink) skipLink.textContent = text('skipLink');
    document.querySelector('meta[name="description"]')?.setAttribute('content', data.description || data.title);
    render();
    if ('ResizeObserver' in window) new ResizeObserver(updateBarHeight).observe(header);
    Object.defineProperty(window, '__quiz', { value: Object.freeze({ snapshot }), configurable: false });
  } catch (error) {
    console.error('Quiz data validation failed:', error.message);
    if (app) {
      app.dataset.screen = 'error';
      app.replaceChildren(append(element('section', 'quiz-error', null, { role: 'alert' }),
        element('h2', '', text('invalidTitle')), element('p', '', text('invalidData'))));
    }
  }
})();
  </script>
</body>
</html>
